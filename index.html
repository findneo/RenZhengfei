<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="任正非公开讲话与文章资料库，支持全文搜索、年份与主题筛选、收藏和沉浸阅读。">
  <title>任正非思想文库</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c83f35'/%3E%3Cpath d='M18 16h23a7 7 0 0 1 7 7v27H25a7 7 0 0 1-7-7V16Zm7 8v18h15V24H25Z' fill='white'/%3E%3Cpath d='M25 42a7 7 0 0 0-7 7' fill='none' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-2: #f8f9fb;
      --text: #17202a;
      --muted: #687281;
      --faint: #929baa;
      --line: #e2e6eb;
      --line-strong: #d4dae2;
      --accent: #c84037;
      --accent-2: #a92d27;
      --accent-soft: #fff0ee;
      --mark: #ffe08a;
      --sidebar: 350px;
      --topbar: 64px;
      --reader-size: 18px;
      --ui-font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, Georgia, serif;
      --shadow: 0 12px 32px rgba(20, 31, 48, .09);
    }

    html[data-theme="dark"] {
      --bg: #0e1218;
      --panel: #151b23;
      --panel-2: #11171e;
      --text: #e8edf3;
      --muted: #a3adba;
      --faint: #778290;
      --line: #29313c;
      --line-strong: #394452;
      --accent: #ee6a60;
      --accent-2: #ff8b82;
      --accent-soft: #351f21;
      --mark: #735b13;
      --shadow: 0 16px 44px rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { overflow: hidden; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: var(--ui-font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font: inherit; }
    button, a, select { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .topbar {
      height: var(--topbar);
      display: grid;
      grid-template-columns: var(--sidebar) minmax(280px, 720px) 1fr;
      align-items: center;
      gap: 22px;
      padding: 0 22px 0 0;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 40;
      backdrop-filter: blur(16px);
    }
    .brand {
      align-self: stretch;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      border-right: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 9px;
      color: #fff;
      background: var(--accent);
      font-family: var(--serif);
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 5px 14px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .brand-copy { min-width: 0; }
    .brand-name { font-size: 16px; font-weight: 750; letter-spacing: .02em; white-space: nowrap; }
    .brand-meta { margin-top: 2px; color: var(--muted); font-size: 12px; white-space: nowrap; }

    .search-shell { position: relative; }
    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    #search {
      width: 100%;
      height: 42px;
      padding: 0 94px 0 44px;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      color: var(--text);
      background: var(--panel-2);
      outline: none;
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }
    #search::placeholder { color: var(--faint); }
    #search:focus {
      border-color: color-mix(in srgb, var(--accent) 64%, var(--line));
      background: var(--panel);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 10%, transparent);
    }
    .search-hint {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--faint);
      font-size: 12px;
      pointer-events: none;
    }
    kbd {
      min-width: 25px;
      padding: 3px 6px;
      text-align: center;
      border: 1px solid var(--line-strong);
      border-bottom-width: 2px;
      border-radius: 6px;
      color: var(--muted);
      background: var(--panel);
      font: 11px/1 var(--ui-font);
    }
    .top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 7px; }
    .icon-button, .soft-button, .primary-button {
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }
    .icon-button {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
    }
    .icon-button:hover { color: var(--text); background: var(--panel-2); }
    .icon-button svg { width: 19px; height: 19px; }
    .mobile-menu { display: none; }

    .reading-progress {
      position: fixed;
      z-index: 60;
      top: calc(var(--topbar) - 2px);
      left: var(--sidebar);
      height: 2px;
      width: 0;
      background: var(--accent);
      transition: width .08s linear;
      pointer-events: none;
    }

    .workspace {
      height: calc(100vh - var(--topbar));
      height: calc(100dvh - var(--topbar));
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      min-height: 0;
    }

    .sidebar {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: var(--panel-2);
      overflow: hidden;
      z-index: 30;
    }
    .filters {
      flex: 0 0 auto;
      padding: 14px 14px 11px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }
    .filter-row { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px; }
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: "";
      position: absolute;
      right: 11px;
      top: 50%;
      width: 6px;
      height: 6px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }
    .filters select {
      width: 100%;
      height: 35px;
      padding: 0 29px 0 10px;
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: var(--panel);
      font-size: 13px;
      cursor: pointer;
    }
    .filter-subrow { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .result-count { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tiny-actions { display: flex; align-items: center; gap: 3px; }
    .tiny-button {
      min-height: 28px;
      padding: 0 7px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      cursor: pointer;
    }
    .tiny-button:hover, .tiny-button.active { color: var(--accent); background: var(--accent-soft); }
    .index-status {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 18px;
      margin-top: 8px;
      color: var(--faint);
      font-size: 11px;
    }
    .index-track { flex: 1; height: 3px; overflow: hidden; border-radius: 99px; background: var(--line); }
    .index-fill { width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .2s ease; }

    .article-list {
      flex: 1 1 auto;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    .year-divider {
      position: sticky;
      top: 0;
      z-index: 4;
      padding: 8px 15px 6px;
      color: var(--muted);
      background: color-mix(in srgb, var(--panel-2) 91%, transparent);
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .08em;
      backdrop-filter: blur(10px);
    }
    .list-row { position: relative; border-bottom: 1px solid var(--line); }
    .article-link {
      min-height: 79px;
      display: block;
      padding: 12px 40px 11px 15px;
      color: inherit;
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: background .12s ease, border-color .12s ease;
    }
    .article-link:hover { background: var(--panel); }
    .list-row.active .article-link { border-left-color: var(--accent); background: var(--panel); }
    .article-link-title {
      display: -webkit-box;
      overflow: hidden;
      color: var(--text);
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.55;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .article-link-meta { margin-top: 6px; display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 11px; }
    .topic-dot { width: 5px; height: 5px; flex: 0 0 auto; border-radius: 50%; background: var(--accent); }
    .favorite-list-button {
      position: absolute;
      right: 8px;
      top: 13px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 7px;
      color: var(--faint);
      background: transparent;
      cursor: pointer;
    }
    .favorite-list-button:hover, .favorite-list-button.active { color: var(--accent); background: var(--accent-soft); }
    .favorite-list-button svg { width: 15px; height: 15px; }
    .search-snippet {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    mark { padding: 0 .08em; color: inherit; background: var(--mark); border-radius: 2px; }
    .empty-list { padding: 48px 24px; color: var(--muted); text-align: center; font-size: 14px; line-height: 1.8; }

    .reader {
      position: relative;
      min-width: 0;
      background: var(--panel);
      overflow: hidden;
    }
    .reader-scroll {
      height: 100%;
      overflow: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }
    .reader-grid {
      width: min(1160px, 100%);
      min-height: 100%;
      margin: 0 auto;
      padding: 0 32px 72px;
      display: grid;
      grid-template-columns: minmax(0, 760px) 220px;
      justify-content: center;
      gap: 72px;
    }
    .reader-main { min-width: 0; }
    .article-header { padding: 58px 0 30px; border-bottom: 1px solid var(--line); }
    .article-kicker { margin-bottom: 13px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .11em; }
    .article-title {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.28;
      letter-spacing: -.02em;
      text-wrap: balance;
    }
    .article-meta { margin-top: 18px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 15px; color: var(--muted); font-size: 13px; }
    .meta-item { display: inline-flex; align-items: center; gap: 6px; }
    .meta-item svg { width: 15px; height: 15px; }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 9px;
      border: 1px solid color-mix(in srgb, var(--accent) 20%, var(--line));
      border-radius: 99px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 12px;
    }
    .article-tools { margin-top: 21px; display: flex; flex-wrap: wrap; gap: 8px; }
    .soft-button, .primary-button {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 9px;
      font-size: 13px;
      text-decoration: none;
    }
    .soft-button { border: 1px solid var(--line); color: var(--muted); background: var(--panel); }
    .soft-button:hover { color: var(--text); border-color: var(--line-strong); background: var(--panel-2); }
    .soft-button.active { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); background: var(--accent-soft); }
    .soft-button svg, .primary-button svg { width: 15px; height: 15px; }
    .primary-button { color: #fff; background: var(--accent); }
    .primary-button:hover { background: var(--accent-2); }

    .markdown-body {
      padding: 35px 0 24px;
      color: var(--text);
      font-family: var(--serif);
      font-size: var(--reader-size);
      line-height: 1.95;
      overflow-wrap: anywhere;
    }
    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body p { margin: 1.15em 0; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      scroll-margin-top: 28px;
      font-family: var(--serif);
      line-height: 1.45;
      letter-spacing: -.01em;
    }
    .markdown-body h1 { margin: 1.7em 0 .7em; font-size: 1.8em; }
    .markdown-body h2 { margin: 2.2em 0 .8em; padding-top: .3em; font-size: 1.42em; }
    .markdown-body h3 { margin: 1.8em 0 .65em; font-size: 1.18em; }
    .markdown-body h4 { margin: 1.5em 0 .6em; font-size: 1.06em; }
    .markdown-body blockquote {
      margin: 1.7em 0;
      padding: .15em 0 .15em 1.25em;
      color: color-mix(in srgb, var(--text) 78%, var(--muted));
      border-left: 3px solid var(--accent);
    }
    .markdown-body blockquote p { margin: .55em 0; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.45em; }
    .markdown-body li { margin: .42em 0; }
    .markdown-body a { text-underline-offset: 3px; text-decoration-thickness: 1px; }
    .markdown-body img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 2em auto;
      border-radius: 8px;
      box-shadow: 0 8px 26px rgba(20, 30, 46, .12);
    }
    .markdown-body code {
      padding: .13em .36em;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .86em;
    }
    .markdown-body pre {
      overflow: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-2);
      line-height: 1.65;
    }
    .markdown-body pre code { padding: 0; border: 0; background: transparent; }
    .markdown-body hr { height: 1px; margin: 2.5em 0; border: 0; background: var(--line); }
    .markdown-body table { width: 100%; margin: 1.7em 0; border-collapse: collapse; font-family: var(--ui-font); font-size: .88em; }
    .markdown-body th, .markdown-body td { padding: 10px 12px; border: 1px solid var(--line); text-align: left; }
    .markdown-body th { background: var(--panel-2); }
    .lead-note {
      margin: 1.5em 0;
      padding: 16px 18px;
      border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
      border-radius: 10px;
      background: var(--accent-soft);
      font-family: var(--ui-font);
      font-size: .9em;
      line-height: 1.8;
    }
    .article-footer-note { margin-top: 35px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.7; }
    .article-nav { margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .nav-card {
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: inherit;
      background: var(--panel-2);
      text-decoration: none;
      transition: border-color .14s ease, transform .14s ease;
    }
    .nav-card:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); transform: translateY(-1px); }
    .nav-card.next { text-align: right; }
    .nav-label { color: var(--faint); font-size: 11px; }
    .nav-title { overflow: hidden; margin-top: 5px; color: var(--text); font-family: var(--serif); font-size: 14px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }

    .toc { position: sticky; top: 36px; align-self: start; max-height: calc(100vh - var(--topbar) - 72px); overflow: auto; margin-top: 64px; }
    .toc-title { margin-bottom: 12px; color: var(--faint); font-size: 11px; font-weight: 750; letter-spacing: .1em; }
    .toc a { display: block; padding: 6px 0 6px 12px; border-left: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.45; text-decoration: none; }
    .toc a:hover, .toc a.active { color: var(--accent); border-left-color: var(--accent); }
    .toc a.level-3 { padding-left: 23px; }
    .toc-empty { color: var(--faint); font-size: 12px; line-height: 1.65; }

    .home { min-height: 100%; padding: 50px 0 72px; }
    .home-intro { padding-bottom: 34px; border-bottom: 1px solid var(--line); }
    .home-eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .home-title { margin: 13px 0 15px; font-family: var(--serif); font-size: clamp(34px, 5vw, 52px); line-height: 1.2; letter-spacing: -.03em; }
    .home-description { max-width: 690px; margin: 0; color: var(--muted); font-family: var(--serif); font-size: 17px; line-height: 1.9; }
    .home-actions { margin-top: 23px; display: flex; flex-wrap: wrap; gap: 9px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin: 32px 0 0; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--line); }
    .stat { padding: 17px 18px; background: var(--panel-2); }
    .stat-value { font-family: var(--serif); font-size: 24px; font-weight: 800; }
    .stat-label { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .home-section { margin-top: 38px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 15px; }
    .section-heading h2 { margin: 0; font-family: var(--serif); font-size: 20px; }
    .section-heading span { color: var(--faint); font-size: 12px; }
    .classic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
    .classic-card {
      position: relative;
      min-height: 126px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: inherit;
      background: var(--panel-2);
      text-decoration: none;
      overflow: hidden;
      transition: border-color .15s ease, transform .15s ease;
    }
    .classic-card::after { content: "↗"; position: absolute; right: 15px; top: 13px; color: var(--faint); font-size: 16px; }
    .classic-card:hover { border-color: color-mix(in srgb, var(--accent) 36%, var(--line)); transform: translateY(-2px); }
    .classic-year { color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .08em; }
    .classic-title { max-width: 90%; margin-top: 9px; font-family: var(--serif); font-size: 17px; font-weight: 800; line-height: 1.5; }
    .classic-topic { margin-top: 9px; color: var(--muted); font-size: 12px; }
    .topic-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .topic-button { min-height: 36px; padding: 0 13px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); background: var(--panel); cursor: pointer; }
    .topic-button:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); }
    .timeline { height: 125px; display: flex; align-items: end; gap: 3px; padding: 18px 12px 25px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
    .timeline-bar { position: relative; flex: 1; min-width: 5px; height: var(--height); border-radius: 3px 3px 1px 1px; background: color-mix(in srgb, var(--accent) 68%, var(--line)); cursor: pointer; }
    .timeline-bar:hover { background: var(--accent); }
    .timeline-bar::after { content: attr(data-short); position: absolute; left: 50%; bottom: -18px; color: var(--faint); font-size: 9px; transform: translateX(-50%); }
    .timeline-bar::before { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 7px); z-index: 2; padding: 4px 7px; border-radius: 5px; color: #fff; background: #252c35; font-size: 10px; white-space: nowrap; opacity: 0; transform: translate(-50%, 4px); pointer-events: none; transition: .12s ease; }
    .timeline-bar:hover::before { opacity: 1; transform: translate(-50%, 0); }
    .recent-list { display: grid; gap: 8px; }
    .recent-link { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; color: inherit; text-decoration: none; }
    .recent-link:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
    .recent-link strong { overflow: hidden; font-family: var(--serif); font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .recent-link span { flex: 0 0 auto; color: var(--faint); font-size: 11px; }

    .loading-view { max-width: 760px; margin: 0 auto; padding: 74px 24px; }
    .skeleton { height: 16px; margin: 14px 0; border-radius: 5px; background: linear-gradient(90deg, var(--panel-2), var(--line), var(--panel-2)); background-size: 220% 100%; animation: shimmer 1.25s infinite linear; }
    .skeleton.title { width: 75%; height: 42px; margin-bottom: 28px; }
    .skeleton.short { width: 52%; }
    @keyframes shimmer { to { background-position: -220% 0; } }
    .error-view { max-width: 620px; margin: 0 auto; padding: 84px 24px; text-align: center; }
    .error-view h2 { font-family: var(--serif); font-size: 25px; }
    .error-view p { color: var(--muted); line-height: 1.75; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 100;
      max-width: calc(100vw - 30px);
      padding: 10px 15px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      color: var(--text);
      background: var(--panel);
      box-shadow: var(--shadow);
      font-size: 13px;
      opacity: 0;
      transform: translate(-50%, 12px);
      pointer-events: none;
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .drawer-backdrop { display: none; }

    @media (max-width: 1120px) {
      .reader-grid { grid-template-columns: minmax(0, 760px); }
      .toc { display: none; }
    }
    @media (max-width: 820px) {
      :root { --topbar: 58px; }
      .topbar { grid-template-columns: auto minmax(0, 1fr) auto; gap: 9px; padding: 0 10px; }
      .brand { align-self: auto; padding: 0; border: 0; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-copy { display: none; }
      .search-hint { display: none; }
      #search { height: 40px; padding-right: 12px; }
      .desktop-only { display: none; }
      .mobile-menu { display: inline-flex; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        top: var(--topbar);
        bottom: 0;
        left: 0;
        width: min(88vw, 370px);
        border-right: 1px solid var(--line-strong);
        box-shadow: var(--shadow);
        transform: translateX(-105%);
        transition: transform .22s ease;
      }
      body.drawer-open .sidebar { transform: translateX(0); }
      .drawer-backdrop { position: fixed; z-index: 25; inset: var(--topbar) 0 0; background: rgba(6, 10, 16, .4); backdrop-filter: blur(2px); }
      body.drawer-open .drawer-backdrop { display: block; }
      .reading-progress { left: 0; top: calc(var(--topbar) - 2px); }
      .reader-grid { padding: 0 20px 55px; }
      .article-header { padding-top: 36px; }
      .article-title { font-size: clamp(28px, 8vw, 38px); }
      .markdown-body { font-size: var(--reader-size); line-height: 1.88; }
      .home { padding-top: 34px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .classic-grid { grid-template-columns: 1fr; }
      .timeline { gap: 2px; padding-left: 8px; padding-right: 8px; }
      .timeline-bar:nth-child(even)::after { display: none; }
    }
    @media (max-width: 480px) {
      .reader-grid { padding-left: 17px; padding-right: 17px; }
      .article-meta { font-size: 12px; }
      .article-tools .button-label { display: none; }
      .article-nav { grid-template-columns: 1fr; }
      .nav-card.next { text-align: left; }
      .home-title { font-size: 36px; }
      .home-description { font-size: 16px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat { padding: 14px; }
      .stat-value { font-size: 21px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    @media print {
      html, body { height: auto; overflow: visible; background: #fff; }
      .topbar, .sidebar, .toc, .article-tools, .article-nav, .reading-progress, .toast { display: none !important; }
      .workspace, .reader, .reader-scroll { display: block; height: auto; overflow: visible; }
      .reader-grid { display: block; width: auto; padding: 0; }
      .article-header { padding-top: 0; }
      .markdown-body { color: #111; font-size: 12pt; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" id="home-button" role="button" tabindex="0" aria-label="返回文库首页">

    <div class="search-shell">

      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>

      <button class="icon-button desktop-only" id="font-up" type="button" aria-label="放大正文字号" title="放大正文字号"><span style="font-weight:700;font-size:16px">A+</span></button>

        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.23c-3.23.7-3.91-1.37-3.91-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.39.97.1-.75.4-1.27.74-1.56-2.58-.29-5.29-1.29-5.29-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18A10.9 10.9 0 0 1 12 6.1c.98 0 1.95.13 2.87.39 2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.72 5.39-5.3 5.68.42.36.79 1.07.79 2.16v3.25c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"></path></svg>

  <div class="reading-progress" id="reading-progress"></div>

  <div class="workspace">
    <aside class="sidebar" aria-label="文章目录">

    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    const REPO = 'findneo/RenZhengfei';
    const BRANCH = 'master';
    const SUMMARY_URL = 'SUMMARY.md';
    const TREE_URL = `https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`;
    const PATH_CORRECTIONS = new Map([
      ['2009/20090327_与PMS高端项目经理的座谈纪要.md', '2009/20090327_任正非与PMS高端项目经理的座谈纪要.md']
    ]);
    const EXTRA_ARTICLES = new Map([
      ['1998/1998_把生命注入到产品中去.md', '把生命注入到产品中去']
    ]);
    const CLASSICS = [
      '2001/20010201_华为的冬天.md',
      '2009/20090115_开放、妥协与灰度.md',
      '1998/19980620_华为的红旗到底能打多久.md',
      '2001/20010208_我的父亲母亲.md'
    ];
    const ICONS = {
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>',
      moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.7 15.2A9 9 0 1 1 8.8 3.3a7 7 0 0 0 11.9 11.9Z"></path></svg>',
      star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.75 5.57 6.15.9-4.45 4.33 1.05 6.12L12 17.03l-5.5 2.89 1.05-6.12L3.1 9.47l6.15-.9L12 3Z"></path></svg>',
      starFill: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.7 2.88 5.83 6.43.94-4.65 4.53 1.1 6.4L12 17.38 6.24 20.4l1.1-6.4-4.65-4.53 6.43-.94L12 2.7Z"></path></svg>',
      calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v4M18 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z"></path></svg>',
      clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>',
      copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V4H4v12h4"></path></svg>',
      source: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 5h5v5M10 14 19 5M19 13v6H5V5h6"></path></svg>',
      print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5h20v5a2 2 0 0 1-2 2h-2"></path><path d="M6 15h12v6H6z"></path></svg>',
      shuffle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>'
    };
    const TOPIC_RULES = [
      ['组织与管理', /组织|管理|干部|领导|变革|流程|机关|任职|考核|评价|委员会|董事|授权|权力/],
      ['技术与研发', /研发|技术|创新|研究|科学|实验室|软件|产品|质量|5G|云|人工智能|智能世界|工程|专利/iu],
      ['战略与经营', /战略|经营|商业|增长|机会|竞争|生存|发展|主航道|胜利|危机|冬天|熵|利润/],
      ['市场与客户', /市场|客户|销售|营销|合同|代表处|服务|交付|区域|运营商|消费者|项目经理/],
      ['人才与激励', /人才|人力|员工|奋斗者|激励|薪酬|培训|选拔|专家|职员|继任|英雄|队伍/],
      ['财经与风控', /财务|财经|审计|内控|预算|成本|回款|合规|风险|采购|库存|账|CFO|IFS/iu],
      ['文化与价值观', /文化|价值观|自我批判|艰苦奋斗|责任|使命|青春|生命|父亲|母亲|灰度|妥协|开放|精神文明/],
      ['全球化与社会', /美国|欧洲|日本|英国|法国|德国|俄罗斯|非洲|海外|全球|国际|国家|社会|媒体|大学|世界/]
    ];

    const dom = {
      search: document.querySelector('#search'),
      year: document.querySelector('#year-filter'),
      topic: document.querySelector('#topic-filter'),
      list: document.querySelector('#article-list'),
      count: document.querySelector('#result-count'),
      indexLabel: document.querySelector('#index-label'),
      indexFill: document.querySelector('#index-fill'),
      readerScroll: document.querySelector('#reader-scroll'),
      progress: document.querySelector('#reading-progress'),
      brandMeta: document.querySelector('#brand-meta'),
      favoritesFilter: document.querySelector('#favorites-filter'),
      sortButton: document.querySelector('#sort-button'),
      themeButton: document.querySelector('#theme-button'),
      menuButton: document.querySelector('#menu-button'),
      backdrop: document.querySelector('#drawer-backdrop'),
      toast: document.querySelector('#toast')
    };

    const state = {
      docs: [],
      byPath: new Map(),
      query: '',
      year: 'all',
      topic: 'all',
      favoritesOnly: false,
      sort: 'newest',
      activePath: null,
      activeList: [],
      rawCache: new Map(),
      fetches: new Map(),
      indexed: new Set(),
      indexStarted: false,
      indexDone: false,
      indexFailures: 0,
      favorites: new Set(readJSON('rzf-favorites', [])),
      recent: readJSON('rzf-recent', []),
      fontSize: clamp(Number(localStorage.getItem('rzf-font-size')) || 18, 16, 23),
      theme: localStorage.getItem('rzf-theme') || 'auto',
      toastTimer: null,
      listRenderTimer: null,
      lastSearchRender: 0,
      scrollTimer: null,
      headingObserver: null
    };

    function readJSON(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch (_) { return fallback; }
    }

    function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }
    function escapeHTML(value = '') {
      return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }
    function escapeRegExp(value = '') { return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    function normalize(value = '') { return String(value).normalize('NFKC').toLocaleLowerCase('zh-CN'); }
    function encodePath(path) { return path.split('/').map(encodeURIComponent).join('/'); }
    function articleHash(path) { return '#!/read/' + encodePath(path); }
    function sourceURL(path) { return `https://github.com/${REPO}/blob/${BRANCH}/${encodePath(path)}`; }
    function titleFromPath(path) {
      return path.split('/').pop().replace(/\.md$/i, '').replace(/^\d{4,8}[_-]?/, '').replace(/_/g, ' ').trim();
    }
    function pathDate(path) {
      const name = path.split('/').pop();
      const full = name.match(/^(\d{4})(\d{2})(\d{2})/);
      if (full) {
        const y = +full[1], m = +full[2], d = +full[3];
        if (m >= 1 && m <= 12 && d >= 1 && d <= 31) return { key: `${full[1]}${full[2]}${full[3]}`, label: `${y}年${m}月${d}日` };
      }
      const month = name.match(/^(\d{4})(\d{2})/);
      if (month && +month[2] >= 1 && +month[2] <= 12) return { key: `${month[1]}${month[2]}00`, label: `${+month[1]}年${+month[2]}月` };
      const year = path.match(/^(\d{4})\//)?.[1] || '';
      return { key: `${year}0000`, label: year ? `${year}年` : '日期不详' };
    }
    function topicsFor(title) {
      const hits = TOPIC_RULES.filter(([, rule]) => rule.test(title)).map(([name]) => name);
      return hits.length ? hits.slice(0, 3) : ['其他'];
    }
    function makeDoc(title, path, size = 0) {
      const date = pathDate(path);
      return { title: title || titleFromPath(path), path, year: path.slice(0, 4), dateKey: date.key, dateLabel: date.label, size, topics: topicsFor(title || titleFromPath(path)), searchText: '', plainText: '', score: 0, snippet: '' };
    }

    async function loadCatalog() {
      const summaryMap = new Map();
      const docs = new Map();
      let summaryText = '';
      try {
        const response = await fetch(SUMMARY_URL, { cache: 'no-cache' });
        if (!response.ok) throw new Error(`目录读取失败 (${response.status})`);
        summaryText = await response.text();
      } catch (_) {
        summaryText = '';
      }

      if (summaryText) {
        const regex = /^\s*[*-]\s+\[([^\]]+)]\(([^)]+\.md)\)\s*$/gm;
        let match;
        while ((match = regex.exec(summaryText))) {
          let path = match[2].trim();
          if (!/^\d{4}\/.+\.md$/i.test(path)) continue;
          path = PATH_CORRECTIONS.get(path) || path;
          summaryMap.set(path, match[1].trim().replace(/\.md$/i, ''));
          docs.set(path, makeDoc(summaryMap.get(path), path));
        }
        // 仓库里有一篇文章未被原 SUMMARY.md 收录，在这里补齐当前资料集。
        for (const [path, title] of EXTRA_ARTICLES) docs.set(path, makeDoc(title, path));
      }

      // SUMMARY.md 与页面同源，优先使用它以避免外部 API 阻塞首屏。
      // 只有目录缺失或格式异常时，才回退到 GitHub Tree API。
      if (!docs.size) {
        try {
          const response = await fetch(TREE_URL, { headers: { Accept: 'application/vnd.github+json' } });
          if (!response.ok) throw new Error(`GitHub API ${response.status}`);
          const data = await response.json();
          if (Array.isArray(data.tree)) {
            for (const item of data.tree) {
              if (item.type !== 'blob' || !/^\d{4}\/.+\.md$/i.test(item.path)) continue;
              docs.set(item.path, makeDoc(titleFromPath(item.path), item.path, item.size || 0));
            }
          }
        } catch (_) {
          // 统一交给下方的可读错误状态处理。
        }
      }

      if (!docs.size) throw new Error('未能读取文章目录，请确认 SUMMARY.md 与本页面位于同一目录。');
      state.docs = [...docs.values()].sort((a, b) => b.dateKey.localeCompare(a.dateKey) || a.title.localeCompare(b.title, 'zh-CN'));
      state.byPath = new Map(state.docs.map(doc => [doc.path, doc]));
      dom.brandMeta.textContent = `${state.docs.length} 篇 · ${state.docs.at(-1)?.year || '1994'}—${state.docs[0]?.year || '2018'}`;
      buildFilters();
      renderList();
      route();

      const saveData = navigator.connection?.saveData;
      if (!saveData && !location.search.includes('noindex')) {
        const begin = () => startFullTextIndex();
        if ('requestIdleCallback' in window) requestIdleCallback(begin, { timeout: 1800 });
        else setTimeout(begin, 900);
      } else {
        updateIndexStatus('输入关键词后建立全文索引');
      }
    }

    function buildFilters() {
      const years = [...new Set(state.docs.map(doc => doc.year))].sort((a, b) => b.localeCompare(a));
      dom.year.insertAdjacentHTML('beforeend', years.map(year => `<option value="${year}">${year}年</option>`).join(''));
      const topicCounts = new Map();
      for (const doc of state.docs) for (const topic of doc.topics) topicCounts.set(topic, (topicCounts.get(topic) || 0) + 1);
      const topics = [...topicCounts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-CN'));
      dom.topic.insertAdjacentHTML('beforeend', topics.map(([topic, count]) => `<option value="${escapeHTML(topic)}">${escapeHTML(topic)} · ${count}</option>`).join(''));
    }

    function parseTerms(query) {
      const matches = query.match(/"([^"]+)"|'([^']+)'|\S+/g) || [];
      return [...new Set(matches.map(item => normalize(item.replace(/^["']|["']$/g, ''))).filter(Boolean))];
    }

    function occurrenceCount(haystack, needle, limit = 12) {
      let count = 0, index = 0;
      while (count < limit && (index = haystack.indexOf(needle, index)) !== -1) { count++; index += Math.max(1, needle.length); }
      return count;
    }

    function searchDocs() {
      const terms = parseTerms(state.query);
      const hasQuery = terms.length > 0;
      const results = [];
      for (const doc of state.docs) {
        if (state.year !== 'all' && doc.year !== state.year) continue;
        if (state.topic !== 'all' && !doc.topics.includes(state.topic)) continue;
        if (state.favoritesOnly && !state.favorites.has(doc.path)) continue;
        let score = 0;
        let firstBodyIndex = -1;
        if (hasQuery) {
          const title = normalize(doc.title);
          let matched = true;
          for (const term of terms) {
            const ti = title.indexOf(term);
            const bi = doc.searchText ? doc.searchText.indexOf(term) : -1;
            if (ti === -1 && bi === -1) { matched = false; break; }
            if (title === term) score += 1200;
            else if (title.startsWith(term)) score += 520;
            else if (ti !== -1) score += 260;
            if (bi !== -1) {
              score += 24 + occurrenceCount(doc.searchText, term) * 3;
              if (firstBodyIndex === -1 || bi < firstBodyIndex) firstBodyIndex = bi;
            }
          }
          if (!matched) continue;
          score += Number(doc.dateKey) / 100000000;
        }
        doc.score = score;
        doc.snippet = hasQuery && firstBodyIndex !== -1 ? makeSnippet(doc.plainText, terms) : '';
        results.push(doc);
      }
      if (hasQuery) results.sort((a, b) => b.score - a.score || b.dateKey.localeCompare(a.dateKey));
      else if (state.sort === 'newest') results.sort((a, b) => b.dateKey.localeCompare(a.dateKey) || a.title.localeCompare(b.title, 'zh-CN'));
      else results.sort((a, b) => a.dateKey.localeCompare(b.dateKey) || a.title.localeCompare(b.title, 'zh-CN'));
      return results;
    }

    function makeSnippet(text, terms) {
      if (!text) return '';
      const normalized = normalize(text);
      let index = -1;
      for (const term of terms) {
        const found = normalized.indexOf(term);
        if (found !== -1 && (index === -1 || found < index)) index = found;
      }
      if (index === -1) return '';
      const start = Math.max(0, index - 42);
      const end = Math.min(text.length, index + 115);
      return `${start ? '…' : ''}${text.slice(start, end).trim()}${end < text.length ? '…' : ''}`;
    }

    function highlight(text, terms) {
      if (!terms.length) return escapeHTML(text);
      const pattern = new RegExp(`(${terms.map(escapeRegExp).sort((a, b) => b.length - a.length).join('|')})`, 'giu');
      return escapeHTML(text).replace(pattern, '<mark>$1</mark>');
    }

    function renderList() {
      const results = searchDocs();
      state.activeList = results;
      const terms = parseTerms(state.query);
      const suffix = state.indexStarted && !state.indexDone && terms.length ? ' · 全文仍在载入' : '';
      dom.count.textContent = `${results.length} 篇${suffix}`;
      dom.favoritesFilter.classList.toggle('active', state.favoritesOnly);
      if (!results.length) {
        dom.list.innerHTML = `<div class="empty-list">没有找到匹配文章。<br>${state.indexStarted && !state.indexDone ? '全文索引尚未完成，结果会自动更新。' : '试试更短的关键词或清除筛选。'}</div>`;
        return;
      }
      let lastYear = '';
      const html = [];
      for (const doc of results) {
        if (!terms.length && doc.year !== lastYear) {
          html.push(`<div class="year-divider">${escapeHTML(doc.year)} 年</div>`);
          lastYear = doc.year;
        }
        const favorite = state.favorites.has(doc.path);
        html.push(`
          <div class="list-row${doc.path === state.activePath ? ' active' : ''}" data-path="${escapeHTML(doc.path)}">
            <a class="article-link" href="${articleHash(doc.path)}">
              <div class="article-link-title">${highlight(doc.title, terms)}</div>
              <div class="article-link-meta"><span>${escapeHTML(doc.dateLabel)}</span><span class="topic-dot"></span><span>${escapeHTML(doc.topics[0])}</span></div>
              ${doc.snippet ? `<div class="search-snippet">${highlight(doc.snippet, terms)}</div>` : ''}
            </a>
            <button class="favorite-list-button${favorite ? ' active' : ''}" type="button" data-favorite="${escapeHTML(doc.path)}" aria-label="${favorite ? '取消收藏' : '收藏'}：${escapeHTML(doc.title)}">${favorite ? ICONS.starFill : ICONS.star}</button>
          </div>`);
      }
      dom.list.innerHTML = html.join('');
    }

    function scheduleListRender(force = false) {
      clearTimeout(state.listRenderTimer);
      const elapsed = performance.now() - state.lastSearchRender;
      const delay = force ? 0 : Math.max(0, 180 - elapsed);
      state.listRenderTimer = setTimeout(() => {
        state.lastSearchRender = performance.now();
        renderList();
      }, delay);
    }

    async function fetchRaw(doc) {
      if (state.rawCache.has(doc.path)) return state.rawCache.get(doc.path);
      if (state.fetches.has(doc.path)) return state.fetches.get(doc.path);
      const promise = fetch(encodePath(doc.path), { cache: 'force-cache' })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then(text => {
          state.rawCache.set(doc.path, text);
          indexDocument(doc, text);
          return text;
        })
        .finally(() => state.fetches.delete(doc.path));
      state.fetches.set(doc.path, promise);
      return promise;
    }

    function stripMarkdown(markdown) {
      return markdown
        .replace(/```[\s\S]*?```/g, ' ')
        .replace(/!\[([^\]]*)]\([^)]+\)/g, '$1')
        .replace(/\[([^\]]+)]\([^)]+\)/g, '$1')
        .replace(/^\s{0,3}[#>*+-]+\s*/gm, '')
        .replace(/[`*_~|]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function indexDocument(doc, raw) {
      if (state.indexed.has(doc.path)) return;
      doc.plainText = stripMarkdown(raw);
      doc.searchText = normalize(`${doc.title} ${doc.plainText}`);
      state.indexed.add(doc.path);
      updateIndexStatus();
    }

    async function startFullTextIndex() {
      if (state.indexStarted || !state.docs.length) return;
      state.indexStarted = true;
      updateIndexStatus();
      let cursor = 0;
      const workers = Array.from({ length: 6 }, async () => {
        while (cursor < state.docs.length) {
          const doc = state.docs[cursor++];
          if (!state.indexed.has(doc.path)) {
            try { await fetchRaw(doc); }
            catch (_) {
              state.indexFailures++;
              state.indexed.add(doc.path);
              updateIndexStatus();
            }
          }
          if (state.query && state.indexed.size % 12 === 0) scheduleListRender();
        }
      });
      await Promise.all(workers);
      state.indexDone = true;
      updateIndexStatus();
      if (state.query) scheduleListRender(true);
    }

    function updateIndexStatus(customLabel = '') {
      if (customLabel) {
        dom.indexLabel.textContent = customLabel;
        dom.indexFill.style.width = '0%';
        return;
      }
      const total = state.docs.length || 1;
      const count = state.indexed.size;
      const percent = Math.round(count / total * 100);
      dom.indexFill.style.width = `${percent}%`;
      if (!state.indexStarted) dom.indexLabel.textContent = '等待全文索引';
      else if (!state.indexDone) dom.indexLabel.textContent = `全文索引 ${count}/${total}`;
      else dom.indexLabel.textContent = state.indexFailures ? `全文可搜索 · ${state.indexFailures} 篇读取失败` : '全文已可搜索';
    }

    function route() {
      const prefix = '#!/read/';
      if (location.hash.startsWith(prefix)) {
        const raw = location.hash.slice(prefix.length);
        let path = '';
        try { path = raw.split('/').map(decodeURIComponent).join('/'); } catch (_) { path = raw; }
        const doc = state.byPath.get(path);
        if (doc) { openArticle(doc); return; }
        renderError('没有找到这篇文章', '链接可能已经失效，或文章目录尚未更新。');
        return;
      }
      state.activePath = null;
      renderList();
      renderHome();
    }

    async function openArticle(doc) {
      state.activePath = doc.path;
      renderList();
      closeDrawer();
      dom.progress.style.width = '0%';
      dom.readerScroll.scrollTop = 0;
      dom.readerScroll.innerHTML = `<div class="loading-view"><div class="skeleton title"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton short"></div></div>`;
      try {
        const raw = await fetchRaw(doc);
        renderArticle(doc, raw);
      } catch (error) {
        renderError('文章读取失败', `无法载入“${doc.title}”。请检查文件名是否与 SUMMARY.md 中的链接一致，然后刷新重试。`);
      }
    }

    function renderArticle(doc, raw) {
      const cleaned = removeDuplicateHeading(raw, doc.title);
      const estimatedMinutes = Math.max(1, Math.round((doc.plainText.length || stripMarkdown(raw).length) / 500));
      const favorite = state.favorites.has(doc.path);
      const currentIndex = state.docs.findIndex(item => item.path === doc.path);
      const newer = currentIndex > 0 ? state.docs[currentIndex - 1] : null;
      const older = currentIndex >= 0 && currentIndex < state.docs.length - 1 ? state.docs[currentIndex + 1] : null;
      const articleHTML = renderMarkdown(cleaned, doc.path);
      dom.readerScroll.innerHTML = `
        <div class="reader-grid">
          <div class="reader-main">
            <article>
              <header class="article-header">
                <div class="article-kicker">${escapeHTML(doc.year)} · 任正非公开讲话与文章</div>
                <h1 class="article-title">${escapeHTML(doc.title)}</h1>
                <div class="article-meta">
                  <span class="meta-item">${ICONS.calendar}${escapeHTML(doc.dateLabel)}</span>
                  <span class="meta-item">${ICONS.clock}约 ${estimatedMinutes} 分钟</span>
                  ${doc.topics.map(topic => `<span class="tag">${escapeHTML(topic)}</span>`).join('')}
                </div>
                <div class="article-tools">
                  <button class="soft-button${favorite ? ' active' : ''}" id="article-favorite" type="button">${favorite ? ICONS.starFill : ICONS.star}<span class="button-label">${favorite ? '已收藏' : '收藏'}</span></button>
                  <button class="soft-button" id="copy-link" type="button">${ICONS.copy}<span class="button-label">复制链接</span></button>
                  <button class="soft-button" id="print-article" type="button">${ICONS.print}<span class="button-label">打印</span></button>
                  <a class="soft-button" href="${sourceURL(doc.path)}" target="_blank" rel="noopener noreferrer">${ICONS.source}<span class="button-label">查看原文</span></a>
                </div>
              </header>
              <div class="markdown-body" id="article-body">${articleHTML}</div>
              <div class="article-footer-note">本页面是对公开资料的阅读整理。若内容存在错漏，请以仓库中的原始 Markdown 文件为准。</div>
              <nav class="article-nav" aria-label="上一篇与下一篇">
                ${older ? `<a class="nav-card" href="${articleHash(older.path)}"><div class="nav-label">← 较早一篇</div><div class="nav-title">${escapeHTML(older.title)}</div></a>` : '<div></div>'}
                ${newer ? `<a class="nav-card next" href="${articleHash(newer.path)}"><div class="nav-label">较新一篇 →</div><div class="nav-title">${escapeHTML(newer.title)}</div></a>` : '<div></div>'}
              </nav>
            </article>
          </div>
          <aside class="toc" id="toc" aria-label="本文目录"></aside>
        </div>`;
      document.title = `${doc.title} · 任正非思想文库`;
      buildTOC();
      bindArticleActions(doc);
      rememberRecent(doc);
      restorePosition(doc.path);
      requestAnimationFrame(updateReadingProgress);
    }

    function removeDuplicateHeading(raw, title) {
      const lines = raw.replace(/^\uFEFF/, '').split(/\r?\n/);
      const first = lines.findIndex(line => line.trim());
      if (first !== -1) {
        const match = lines[first].match(/^#{1,6}\s+(.+?)\s*#*$/);
        if (match && normalize(match[1]).replace(/[\s，。、：:]/g, '') === normalize(title).replace(/[\s，。、：:]/g, '')) lines.splice(first, 1);
      }
      return lines.join('\n');
    }

    function renderMarkdown(markdown, currentPath) {
      const lines = markdown.replace(/\r\n?/g, '\n').split('\n');
      const output = [];
      let i = 0;
      let headingCounter = 0;
      const heading = (level, text) => {
        const id = `section-${++headingCounter}`;
        return `<h${level} id="${id}">${renderInline(text.replace(/\s+#+\s*$/, ''), currentPath)}</h${level}>`;
      };
      const startsBlock = (line, next = '') => {
        const t = line.trim();
        return !t || /^```/.test(t) || /^#{1,6}\s/.test(t) || /^>/.test(t) || /^[-*_]{3,}$/.test(t) || /^\s*[-+*]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line) || /^[一二三四五六七八九十百]+[、．.]\s*/.test(t) || /^【[^】]+】/.test(t) || (t.includes('|') && /^\s*\|?\s*:?-{3,}/.test(next.trim()));
      };
      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();
        if (!trimmed) { i++; continue; }

        if (/^```/.test(trimmed)) {
          const language = trimmed.slice(3).trim();
          const code = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i].trim())) code.push(lines[i++]);
          if (i < lines.length) i++;
          output.push(`<pre${language ? ` data-language="${escapeHTML(language)}"` : ''}><code>${escapeHTML(code.join('\n'))}</code></pre>`);
          continue;
        }
        const headingMatch = trimmed.match(/^(#{1,6})\s+(.+)$/);
        if (headingMatch) { output.push(heading(Math.min(4, headingMatch[1].length), headingMatch[2])); i++; continue; }
        if (/^[-*_]{3,}$/.test(trimmed)) { output.push('<hr>'); i++; continue; }

        if (trimmed.startsWith('>')) {
          const quote = [];
          while (i < lines.length && lines[i].trim().startsWith('>')) quote.push(lines[i++].trim().replace(/^>\s?/, ''));
          output.push(`<blockquote><p>${quote.map(value => renderInline(value, currentPath)).join('<br>')}</p></blockquote>`);
          continue;
        }

        const unordered = line.match(/^\s*[-+*]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        if (unordered || ordered) {
          const tag = unordered ? 'ul' : 'ol';
          const items = [];
          const rule = unordered ? /^\s*[-+*]\s+(.+)$/ : /^\s*\d+[.)]\s+(.+)$/;
          while (i < lines.length) {
            const match = lines[i].match(rule);
            if (!match) break;
            items.push(`<li>${renderInline(match[1], currentPath)}</li>`);
            i++;
          }
          output.push(`<${tag}>${items.join('')}</${tag}>`);
          continue;
        }

        if (trimmed.includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1].trim())) {
          const headers = splitTableRow(trimmed);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(splitTableRow(lines[i++]));
          output.push(`<table><thead><tr>${headers.map(cell => `<th>${renderInline(cell, currentPath)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${renderInline(cell, currentPath)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
          continue;
        }

        if (/^[一二三四五六七八九十百]+[、．.]\s*/.test(trimmed)) {
          output.push(heading(2, trimmed)); i++; continue;
        }
        if (/^【[^】]+】/.test(trimmed)) {
          const note = [trimmed];
          i++;
          while (i < lines.length && lines[i].trim() && !startsBlock(lines[i], lines[i + 1] || '')) note.push(lines[i++].trim());
          output.push(`<div class="lead-note">${note.map(value => renderInline(value, currentPath)).join('<br>')}</div>`);
          continue;
        }

        const paragraph = [trimmed];
        i++;
        while (i < lines.length && lines[i].trim() && !startsBlock(lines[i], lines[i + 1] || '')) paragraph.push(lines[i++].trim());
        output.push(`<p>${paragraph.map(value => renderInline(value, currentPath)).join('<br>')}</p>`);
      }
      return output.join('\n');
    }

    function splitTableRow(line) {
      return line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split(/(?<!\\)\|/).map(cell => cell.trim().replace(/\\\|/g, '|'));
    }

    function renderInline(text, currentPath) {
      const tokens = [];
      const stash = html => `\u0000${tokens.push(html) - 1}\u0000`;
      let value = String(text);
      value = value.replace(/`([^`]+)`/g, (_, code) => stash(`<code>${escapeHTML(code)}</code>`));
      value = value.replace(/!\[([^\]]*)]\(([^)\s]+)(?:\s+["'][^"']*["'])?\)/g, (_, alt, url) => {
        const safe = safeAssetURL(url, currentPath);
        return safe ? stash(`<img src="${escapeHTML(safe)}" alt="${escapeHTML(alt)}" loading="lazy" referrerpolicy="no-referrer">`) : escapeHTML(alt);
      });
      value = value.replace(/\[([^\]]+)]\(([^)\s]+)(?:\s+["'][^"']*["'])?\)/g, (_, label, url) => {
        const internal = resolveDocPath(url, currentPath);
        if (internal && state.byPath.has(internal)) return stash(`<a href="${articleHash(internal)}">${escapeHTML(label)}</a>`);
        const safe = safeLinkURL(url, currentPath);
        return safe ? stash(`<a href="${escapeHTML(safe)}" target="_blank" rel="noopener noreferrer">${escapeHTML(label)}</a>`) : escapeHTML(label);
      });
      value = escapeHTML(value)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/__([^_]+)__/g, '<strong>$1</strong>')
        .replace(/~~([^~]+)~~/g, '<del>$1</del>')
        .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
      value = value.replace(/\u0000(\d+)\u0000/g, (_, index) => tokens[Number(index)] || '');
      return value;
    }

    function resolveDocPath(url, currentPath) {
      if (!/\.md(?:#.*)?$/i.test(url)) return '';
      const clean = decodeURIComponent(url.split('#')[0]);
      if (!clean.startsWith('.') && /^\d{4}\//.test(clean)) return PATH_CORRECTIONS.get(clean) || clean;
      const parts = currentPath.split('/').slice(0, -1);
      for (const segment of clean.split('/')) {
        if (!segment || segment === '.') continue;
        if (segment === '..') parts.pop(); else parts.push(segment);
      }
      const path = parts.join('/');
      return PATH_CORRECTIONS.get(path) || path;
    }

    function safeLinkURL(url, currentPath) {
      try {
        const parsed = new URL(url, new URL(encodePath(currentPath), location.href));
        return ['http:', 'https:', 'mailto:'].includes(parsed.protocol) ? parsed.href : '';
      } catch (_) { return ''; }
    }
    function safeAssetURL(url, currentPath) {
      try {
        const parsed = new URL(url, new URL(encodePath(currentPath), location.href));
        return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '';
      } catch (_) { return ''; }
    }

    function buildTOC() {
      const toc = document.querySelector('#toc');
      const headings = [...document.querySelectorAll('#article-body h2, #article-body h3')];
      if (!toc) return;
      if (!headings.length) { toc.innerHTML = '<div class="toc-title">本文目录</div><div class="toc-empty">这篇文章没有分节标题。</div>'; return; }
      toc.innerHTML = `<div class="toc-title">本文目录</div>${headings.map(item => `<a class="level-${item.tagName === 'H3' ? '3' : '2'}" href="#${item.id}">${escapeHTML(item.textContent)}</a>`).join('')}`;
      state.headingObserver?.disconnect();
      state.headingObserver = new IntersectionObserver(entries => {
        const visible = entries.filter(entry => entry.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (!visible) return;
        toc.querySelectorAll('a').forEach(link => link.classList.toggle('active', link.getAttribute('href') === `#${visible.target.id}`));
      }, { root: dom.readerScroll, rootMargin: '-12% 0px -75% 0px', threshold: 0 });
      headings.forEach(item => state.headingObserver.observe(item));
    }

    function bindArticleActions(doc) {
      document.querySelector('#article-favorite')?.addEventListener('click', event => {
        toggleFavorite(doc.path);
        const favorite = state.favorites.has(doc.path);
        event.currentTarget.classList.toggle('active', favorite);
        event.currentTarget.innerHTML = `${favorite ? ICONS.starFill : ICONS.star}<span class="button-label">${favorite ? '已收藏' : '收藏'}</span>`;
      });
      document.querySelector('#copy-link')?.addEventListener('click', async () => {
        const url = location.href;
        try { await navigator.clipboard.writeText(url); showToast('文章链接已复制'); }
        catch (_) {
          const area = document.createElement('textarea'); area.value = url; document.body.append(area); area.select(); document.execCommand('copy'); area.remove(); showToast('文章链接已复制');
        }
      });
      document.querySelector('#print-article')?.addEventListener('click', () => window.print());
    }

    function renderHome() {
      state.headingObserver?.disconnect();
      dom.progress.style.width = '0%';
      document.title = '任正非思想文库';
      const years = [...new Set(state.docs.map(doc => doc.year))].sort();
      const counts = years.map(year => [year, state.docs.filter(doc => doc.year === year).length]);
      const max = Math.max(...counts.map(([, count]) => count));
      const topicCounts = TOPIC_RULES.map(([topic]) => [topic, state.docs.filter(doc => doc.topics.includes(topic)).length]).filter(([, count]) => count).sort((a, b) => b[1] - a[1]);
      const classics = CLASSICS.map(path => state.byPath.get(path)).filter(Boolean);
      const recent = state.recent.map(item => state.byPath.get(item.path)).filter(Boolean).slice(0, 5);
      dom.readerScroll.innerHTML = `
        <div class="reader-grid">
          <div class="reader-main home">
            <section class="home-intro">
              <div class="home-eyebrow">PUBLIC SPEECH ARCHIVE</div>
              <h1 class="home-title">任正非思想文库</h1>
              <p class="home-description">收录任正非从 1994 至 2018 年的公开讲话与文章。按时间、主题或全文关键词进入这批资料，观察华为在研发、市场、组织与全球化中的思考脉络。</p>
              <div class="home-actions">
                <button class="primary-button" id="home-search" type="button">开始搜索</button>
                <button class="soft-button" id="random-article" type="button">${ICONS.shuffle}随机阅读</button>
              </div>
              <div class="stats">
                <div class="stat"><div class="stat-value">${state.docs.length}</div><div class="stat-label">篇公开资料</div></div>
                <div class="stat"><div class="stat-value">${years.length}</div><div class="stat-label">个年份</div></div>
                <div class="stat"><div class="stat-value">${years[0]}—${years.at(-1)}</div><div class="stat-label">时间跨度</div></div>
                <div class="stat"><div class="stat-value">${TOPIC_RULES.length}</div><div class="stat-label">个主题视角</div></div>
              </div>
            </section>

            <section class="home-section">
              <div class="section-heading"><h2>从经典文章开始</h2><span>四篇代表性文本</span></div>
              <div class="classic-grid">${classics.map(doc => `<a class="classic-card" href="${articleHash(doc.path)}"><div class="classic-year">${doc.year}</div><div class="classic-title">${escapeHTML(doc.title)}</div><div class="classic-topic">${escapeHTML(doc.topics.join(' · '))}</div></a>`).join('')}</div>
            </section>

            <section class="home-section">
              <div class="section-heading"><h2>按主题浏览</h2><span>依据标题自动归类，一篇可属于多个主题</span></div>
              <div class="topic-grid">${topicCounts.map(([topic, count]) => `<button class="topic-button" type="button" data-home-topic="${escapeHTML(topic)}">${escapeHTML(topic)} · ${count}</button>`).join('')}</div>
            </section>

            <section class="home-section">
              <div class="section-heading"><h2>时间分布</h2><span>点击年份筛选目录</span></div>
              <div class="timeline">${counts.map(([year, count]) => `<button class="timeline-bar" type="button" style="--height:${Math.max(8, count / max * 78)}px" data-home-year="${year}" data-short="${year.slice(2)}" data-tip="${year}年 · ${count}篇" aria-label="筛选 ${year} 年的 ${count} 篇文章"></button>`).join('')}</div>
            </section>

            ${recent.length ? `<section class="home-section"><div class="section-heading"><h2>继续阅读</h2><span>最近打开</span></div><div class="recent-list">${recent.map(doc => `<a class="recent-link" href="${articleHash(doc.path)}"><strong>${escapeHTML(doc.title)}</strong><span>${doc.year}</span></a>`).join('')}</div></section>` : ''}
          </div>
          <aside class="toc"><div class="toc-title">使用提示</div><div class="toc-empty">按 <kbd>/</kbd> 随时搜索。标题结果立即出现，正文会在后台逐步建立全文索引。收藏仅保存在当前浏览器。</div></aside>
        </div>`;
      document.querySelector('#home-search')?.addEventListener('click', () => { dom.search.focus(); dom.search.select(); });
      document.querySelector('#random-article')?.addEventListener('click', randomArticle);
      document.querySelectorAll('[data-home-topic]').forEach(button => button.addEventListener('click', () => {
        state.topic = button.dataset.homeTopic; dom.topic.value = state.topic; renderList(); openDrawer();
      }));
      document.querySelectorAll('[data-home-year]').forEach(button => button.addEventListener('click', () => {
        state.year = button.dataset.homeYear; dom.year.value = state.year; renderList(); openDrawer();
      }));
      dom.readerScroll.scrollTop = 0;
    }

    function renderError(title, message) {
      dom.readerScroll.innerHTML = `<div class="error-view"><h2>${escapeHTML(title)}</h2><p>${escapeHTML(message)}</p><button class="primary-button" type="button" onclick="location.hash=''">返回文库首页</button></div>`;
      document.title = `${title} · 任正非思想文库`;
    }

    function rememberRecent(doc) {
      state.recent = [{ path: doc.path, at: Date.now() }, ...state.recent.filter(item => item.path !== doc.path)].slice(0, 12);
      localStorage.setItem('rzf-recent', JSON.stringify(state.recent));
    }

    function restorePosition(path) {
      const positions = readJSON('rzf-positions', {});
      const top = Number(positions[path]) || 0;
      requestAnimationFrame(() => { dom.readerScroll.scrollTop = top; updateReadingProgress(); });
    }

    function savePosition() {
      if (!state.activePath) return;
      const positions = readJSON('rzf-positions', {});
      positions[state.activePath] = Math.round(dom.readerScroll.scrollTop);
      const recentPaths = state.recent.map(item => item.path);
      for (const key of Object.keys(positions)) if (!recentPaths.includes(key) && key !== state.activePath) delete positions[key];
      localStorage.setItem('rzf-positions', JSON.stringify(positions));
    }

    function updateReadingProgress() {
      const max = dom.readerScroll.scrollHeight - dom.readerScroll.clientHeight;
      dom.progress.style.width = state.activePath && max > 0 ? `${clamp(dom.readerScroll.scrollTop / max * 100, 0, 100)}%` : '0%';
    }

    function toggleFavorite(path) {
      if (state.favorites.has(path)) { state.favorites.delete(path); showToast('已取消收藏'); }
      else { state.favorites.add(path); showToast('已收藏'); }
      localStorage.setItem('rzf-favorites', JSON.stringify([...state.favorites]));
      renderList();
    }

    function randomArticle() {
      const pool = state.activeList.length ? state.activeList : state.docs;
      if (!pool.length) return;
      const doc = pool[Math.floor(Math.random() * pool.length)];
      location.hash = articleHash(doc.path).slice(1);
    }

    function showToast(message) {
      clearTimeout(state.toastTimer);
      dom.toast.textContent = message;
      dom.toast.classList.add('show');
      state.toastTimer = setTimeout(() => dom.toast.classList.remove('show'), 1800);
    }

    function applyFontSize(next) {
      state.fontSize = clamp(next, 16, 23);
      document.documentElement.style.setProperty('--reader-size', `${state.fontSize}px`);
      localStorage.setItem('rzf-font-size', state.fontSize);
      showToast(`正文字号 ${state.fontSize}px`);
    }

    function effectiveTheme() {
      if (state.theme === 'auto') return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      return state.theme;
    }

    function applyTheme() {
      const theme = effectiveTheme();
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#151b23' : '#f7f8fa';
      dom.themeButton.innerHTML = theme === 'dark' ? ICONS.sun : ICONS.moon;
      dom.themeButton.title = theme === 'dark' ? '切换浅色模式' : '切换深色模式';
    }

    function toggleTheme() {
      state.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
      localStorage.setItem('rzf-theme', state.theme);
      applyTheme();
    }

    function openDrawer() {
      if (innerWidth > 820) return;
      document.body.classList.add('drawer-open');
      dom.menuButton.setAttribute('aria-expanded', 'true');
    }
    function closeDrawer() {
      document.body.classList.remove('drawer-open');
      dom.menuButton.setAttribute('aria-expanded', 'false');
    }

    dom.search.addEventListener('input', () => {
      state.query = dom.search.value.trim();
      if (state.query) startFullTextIndex();
      scheduleListRender(true);
      if (innerWidth <= 820 && state.query) openDrawer();
    });
    dom.year.addEventListener('change', () => { state.year = dom.year.value; renderList(); });
    dom.topic.addEventListener('change', () => { state.topic = dom.topic.value; renderList(); });
    dom.favoritesFilter.addEventListener('click', () => { state.favoritesOnly = !state.favoritesOnly; renderList(); });
    dom.sortButton.addEventListener('click', () => {
      state.sort = state.sort === 'newest' ? 'oldest' : 'newest';
      dom.sortButton.textContent = state.sort === 'newest' ? '↓ 新→旧' : '↑ 旧→新';
      renderList();
    });
    dom.list.addEventListener('click', event => {
      const button = event.target.closest('[data-favorite]');
      if (button) { event.preventDefault(); event.stopPropagation(); toggleFavorite(button.dataset.favorite); }
    });
    dom.readerScroll.addEventListener('scroll', () => {
      updateReadingProgress();
      clearTimeout(state.scrollTimer);
      state.scrollTimer = setTimeout(savePosition, 300);
    }, { passive: true });
    dom.menuButton.addEventListener('click', () => document.body.classList.contains('drawer-open') ? closeDrawer() : openDrawer());
    dom.backdrop.addEventListener('click', closeDrawer);
    dom.themeButton.addEventListener('click', toggleTheme);
    document.querySelector('#font-down').addEventListener('click', () => applyFontSize(state.fontSize - 1));
    document.querySelector('#font-up').addEventListener('click', () => applyFontSize(state.fontSize + 1));
    const goHome = () => { location.hash = ''; route(); };
    document.querySelector('#home-button').addEventListener('click', goHome);
    document.querySelector('#home-button').addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') goHome(); });
    window.addEventListener('hashchange', route);
    window.addEventListener('beforeunload', savePosition);
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (state.theme === 'auto') applyTheme(); });
    document.addEventListener('keydown', event => {
      if (event.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { event.preventDefault(); dom.search.focus(); }
      if (event.key === 'Escape') { if (document.body.classList.contains('drawer-open')) closeDrawer(); else if (document.activeElement === dom.search && dom.search.value) { dom.search.value = ''; state.query = ''; renderList(); } }
      if (event.altKey && event.key === 'ArrowLeft') {
        const index = state.docs.findIndex(doc => doc.path === state.activePath);
        if (index < state.docs.length - 1) location.hash = articleHash(state.docs[index + 1].path).slice(1);
      }
      if (event.altKey && event.key === 'ArrowRight') {
        const index = state.docs.findIndex(doc => doc.path === state.activePath);
        if (index > 0) location.hash = articleHash(state.docs[index - 1].path).slice(1);
      }
    });

    document.documentElement.style.setProperty('--reader-size', `${state.fontSize}px`);
    applyTheme();
    loadCatalog().catch(error => renderError('文库初始化失败', error.message || '请稍后刷新重试。'));
  })();
  </script>
</body>
</html>
